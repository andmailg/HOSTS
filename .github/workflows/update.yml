name: Update Hosts

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Рекомендуется зафиксировать стабильную версию вместо '3.x'
        cache: 'pip'          # Включает встроенное кэширование зависимостей для ускорения запуска

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ensure Playwright Browsers are Installed
      run: |
        # Устанавливаем только Chromium (поскольку в коде жестко прописан browser.chromium)
        # и необходимые системные зависимости для работы в Ubuntu
        playwright install chromium --with-deps

    - name: Run script with Validation
      id: run_script
      env:
        URLSCAN_API_KEY: ${{ secrets.URLSCAN_API_KEY }}
      run: python main.py

    - name: Commit and Push changes
      if: success()
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add hosts_advanced.txt
        if ! git diff --cached --quiet; then
          git commit -m "chore: auto-update adblock files"
          git push
        else
          echo "Изменений в списках нет."
        fi

